name: Editorial Brain CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brain-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked baseline and provider-contract environment
        run: |
          python -m pip install uv==0.10.9
          uv sync --frozen --extra brain-cloud --group dev
      - name: Materialize review-collapsed test suite
        run: uv run python scripts/materialize_tests.py
      - name: Static and package gates
        run: |
          uv lock --check
          uv run ruff check src/editorial_brain tests/editorial_brain
          uv run black --check src/editorial_brain tests/editorial_brain
          uv run mypy -p editorial_brain -p video_engine
          uv run python -m build
      - name: Network-free Brain unit, provider, and golden lanes
        run: >-
          uv run pytest -q
          tests/editorial_brain/unit
          tests/editorial_brain/providers
          tests/editorial_brain/golden
      - name: CLI and deterministic benchmark gates
        run: |
          uv run video-brain doctor --json
          uv run video-brain benchmark --json

  brain-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install media and locked analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fontconfig
          python -m pip install uv==0.10.9
          uv sync --frozen --extra brain-all --group dev
      - name: Materialize review-collapsed test suite
        run: uv run python scripts/materialize_tests.py
      - name: Deterministic analysis and performance gates
        run: |
          uv run pytest -q tests/editorial_brain/performance
          uv run pytest -q tests/editorial_brain/integration/test_analysis_render_qc.py

  brain-engine-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install media and locked integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fontconfig
          python -m pip install uv==0.10.9
          uv sync --frozen --extra brain-all --group dev
      - name: Materialize review-collapsed test suite
        run: uv run python scripts/materialize_tests.py
      - name: Brain patch, render-DAG, bounded render, and QC gates
        run: |
          uv run pytest -q tests/editorial_brain/integration
          uv run pytest -q tests/editorial_brain/golden

  optional-provider-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EDITORIAL_BRAIN_RUN_PROVIDER_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked provider environment
        run: |
          python -m pip install uv==0.10.9
          uv sync --frozen --extra brain-cloud --group dev
      - name: Materialize review-collapsed test suite
        run: uv run python scripts/materialize_tests.py
      - name: Run smoke tests only when both credentials exist
        run: |
          if [ -z "$DEEPGRAM_API_KEY" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "Provider smoke skipped: both repository secrets are required."
          else
            uv run pytest -q -m provider_smoke tests/editorial_brain/providers
          fi
