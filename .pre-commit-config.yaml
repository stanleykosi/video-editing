minimum_pre_commit_version: "4.3.0"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: .venv/bin/ruff check src tests scripts tools/video-use/compat
        language: system
        pass_filenames: false
      - id: black
        name: Black
        entry: .venv/bin/black --check src tests scripts tools/video-use/compat
        language: system
        pass_filenames: false
      - id: mypy
        name: MyPy
        entry: .venv/bin/mypy src/video_engine
        language: system
        pass_filenames: false
      - id: unit-tests
        name: Unit tests
        entry: .venv/bin/python -m pytest -q tests/unit
        language: system
        pass_filenames: false
        stages: [pre-push]
